name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the library first: the generated build/*.json (e.g. @library/all.json)
      # is a gitignored artifact that cards-web's typecheck imports, so it must
      # exist before typecheck runs.
      - name: Build library
        run: bun run build:library

      - name: Typecheck (all workspaces)
        run: bun --filter '*' typecheck

      - name: Test (engine/web/test suites)
        run: bun --filter '*' test

      - name: Read pinned Nushell version
        id: nu-version
        run: echo "version=$(tr -d '[:space:]' < .nu-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: ${{ steps.nu-version.outputs.version }}

      - name: PM audit rule tests (Nushell)
        run: nu .claude/scripts/pm-audit.test.nu

      - name: Install Python print-tooling deps
        run: python3 -m pip install -r design/requirements.txt

      - name: Renderer smoke tests (Python)
        run: bun run test:renderer
